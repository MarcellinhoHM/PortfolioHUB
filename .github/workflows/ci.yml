name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Permissão mínima: o CI só lê o código
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes do site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions fixadas por SHA do commit (versão no comentário) para evitar troca silenciosa da tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Rodar testes (links, segurança, estrutura)
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Validar HTML (html-validate, versão travada no package-lock)
        run: |
          npm ci --no-audit --no-fund
          npm run test:html

      - name: Checar sintaxe do JavaScript
        run: for f in assets/js/*.js documentacao/slides/*.js; do node --check "$f"; done

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
