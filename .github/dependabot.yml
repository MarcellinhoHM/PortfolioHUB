version: 2
updates:
  # Atualiza as Actions fixadas por SHA nos workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependências, segurança]
    commit-message:
      prefix: "chore(deps)"

  # Ferramentas de teste do site (html-validate)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependências, ci-cd]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: pip
    directories:
      - /projetos-academicos/bootcamp-claude-api
      - /ferramentas/guia-implantacao-claude
    schedule:
      interval: weekly
    labels: [dependências]
    commit-message:
      prefix: "chore(deps)"
